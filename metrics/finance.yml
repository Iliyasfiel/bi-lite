metrics:
  - id: total_revenue
    name: 营业总收入
    unit: 元
    category: 规模指标
  - id: total_profit
    name: 利润总额
    unit: 元
    category: 盈利指标
  - id: operating_cash_flow
    name: 经营性现金流量净额
    unit: 元
    category: 现金流指标
  - id: debt_to_asset_ratio
    name: 资产负债率
    unit: "%"
    category: 财务比率
    direction: negative
  - id: return_on_equity
    name: 净资产收益率
    unit: "%"
    category: 财务比率
  - id: new_contract_amount
    name: 新签收入合同金额
    unit: 元
    category: 合同指标
