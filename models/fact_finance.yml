# 财务事实：三维交点 × 口径（口径是**窗口声明**不是行上字符串，铁律 5"五值拆三件"）
kind: fact
title: 财务事实（公司 × 指标 × 期间 × 口径）
grain: [fin_month, company_id, metric_id, period_type]
# 口径体系（铁律 5）：窗口起点落在 period_from，终点 ≡ fin_month（semantic: period 那列）。
# - 窗口实存（单月 / 本年累计 / 账面累计）：行上存窗口，查询展开成 period_from 谓词；
# - 窗口平移（去年同期累计）：装载即落去年窗口（shift: -1），查询期标签 +1 年对齐 x 轴
#   ——同一窗口不存两份（存两份必然在审计调整时漂移）；
# - calculator（单月同比）：不落行，语义层算，缺去年行拒绝不静默。
windowFrom: period_from
calibers:
  - name: 单月
    from: same
  - name: 本年累计
    from: year_start
  - name: 去年同期累计
    from: year_start
    shift: -1
  - name: 账面累计
    from: since
    since: "2025-01"
  - name: 单月同比
    calculator: true
    operand: 单月
keys:
  - name: fin_month
    type: date
    key: true
    notNull: true
    semantic: period
  - name: period_from
    type: date
    notNull: true
    comment: 窗口起点（终点 ≡ fin_month）——口径是窗口声明（铁律 5），不是行上字符串
  - name: company_id
    type: varchar
    role: dim_fk
    key: true
    refs: dim_company
    notNull: true
    semantic: org
  - name: metric_id
    type: varchar
    role: dim_fk
    key: true
    refs: dim_metric
    notNull: true
    semantic: metric
  - name: period_type
    type: varchar
    key: true
    notNull: true
    semantic: period_type
    comment: 过渡态列：刀 23 对拍独立算法（新旧两路对上才删列重灌，开发计划 §3.2）
measures:
  - name: amount
    type: decimal(18,2)
    unit: 元
    semantic: money
provenance:
  - name: batch_id
    type: varchar
